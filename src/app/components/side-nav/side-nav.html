<aside class="sidebar">
  <div class="profile-wrap">
    <button
      type="button"
      class="profile profile-toggle"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <div class="avatar">{{ initials() || '?' }}</div>
      <div>
        <strong>{{ user()?.name }}</strong><span>{{ user()?.email }}</span>
      </div>
      <span class="chevron">⌄</span>
    </button>
    @if (menuOpen()) {
      <div class="profile-menu" role="menu">
        <button type="button" role="menuitem" (click)="logout()">Log out</button>
      </div>
    }
  </div>
  <nav aria-label="Main navigation">
    <span class="nav-label">Workspace</span>
    <button [class.active]="activeView === views.Catalog" (click)="navigate(views.Catalog)">
      <span class="nav-icon">⌕</span>Discover books
    </button>
    <button
      [class.active]="activeView === views.Reservations"
      (click)="navigate(views.Reservations)"
    >
      <span class="nav-icon">▣</span>My reservations <b>2</b>
    </button>
    <button [class.active]="activeView === views.Users" (click)="navigate(views.Users)">
      <span class="nav-icon">♙</span>Library users
    </button>
    <span class="nav-label space-top">Manage</span>
    <button [class.active]="activeView === views.Admin" (click)="navigate(views.Admin)">
      <span class="nav-icon">⌘</span>Admin console
    </button>
  </nav>
  <div class="sidebar-bottom">
    <div class="help-icon">?</div>
    <div><strong>Need a hand?</strong><span>Visit the help center</span></div>
  </div>
</aside>
