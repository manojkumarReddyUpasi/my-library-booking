<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <p class="auth-brand">PageTurn Yes do<span>.</span></p>
    <p class="auth-eyebrow">WELCOME BACK</p>
    <h1 id="login-title">Sign .. in... Let go</h1>
    <p class="auth-intro">Sign yes in to continue to your library account. .... yes</p>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <label class="auth-field">
        Email address
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="name@example.com"
        />
        @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
          <span class="auth-notice">Enter a valid email address.</span>
        }
      </label>
      <label class="auth-field">
        Password
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Enter your password"
        />
        @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
          <span class="auth-notice">Password is required.</span>
        }
      </label>
      @if (notice()) {
        <p class="auth-notice" role="status">{{ notice() }}</p>
      }
      <button class="auth-submit" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-switch">
      Don’t have an account? <a routerLink="/register">Create an account</a>
    </p>
  </section>
</main>
