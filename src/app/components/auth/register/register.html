<main class="auth-page">
  <section class="auth-card" aria-labelledby="register-title">
    <p class="auth-brand">PageTurn<span>.</span></p>
    <p class="auth-eyebrow">JOIN THE LIBRARY</p>
    <h1 id="register-title">Create your account</h1>
    <p class="auth-intro">Register to discover and reserve books from your library.</p>

    <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="submit()" novalidate>
      <label class="auth-field">
        Name
        <input
          type="text"
          formControlName="name"
          autocomplete="name"
          placeholder="Enter your name"
        />
        @if (registerForm.controls.name.touched && registerForm.controls.name.invalid) {
          <span class="auth-notice">Enter your name.</span>
        }
      </label>
      <label class="auth-field">
        Email address
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="name@example.com"
        />
        @if (registerForm.controls.email.touched && registerForm.controls.email.invalid) {
          <span class="auth-notice">Enter a valid email address.</span>
        }
      </label>
      <label class="auth-field">
        Password
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Create a password"
        />
        @if (registerForm.controls.password.touched && registerForm.controls.password.invalid) {
          <span class="auth-notice">Password must be at least 6 characters.</span>
        }
      </label>
      @if (notice()) {
        <p class="auth-notice" [class.auth-success]="noticeType() === 'success'" role="status">
          {{ notice() }}
        </p>
      }
      <button class="auth-submit" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-switch">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </section>
</main>
